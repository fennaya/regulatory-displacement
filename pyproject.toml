[project]
name = "displacement-observatory"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "fennaya", email = "emssaadaya@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "comtradeapicall>=1.3.2",
    "duckdb>=1.5.5",
    "fastapi>=0.141.1",
    "jinja2>=3.1.6",
    "numpy>=2.5.3",
    "plotly>=7.1.0",
    "pyarrow>=25.0.1",
    "pydantic>=2.13.5",
    "pyfixest>=0.60.0",
    "python-dotenv>=1.2.3",
    "pyyaml>=6.0.3",
    "requests>=2.34.2",
    "uvicorn[standard]>=0.53.0",
]

[project.scripts]
displacement-observatory = "displacement_observatory:main"

[build-system]
requires = ["uv_build>=0.12.13,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
]

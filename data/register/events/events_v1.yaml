  - event_id: "rotterdam-2011-endosulfan"
    substance: "Endosulfan"
    jurisdiction: "Global (Rotterdam Convention Parties)"
    restriction_type: "severe_restriction"
    scope: >
      Listed in Annex III of the Rotterdam Convention, subjecting
      international trade in endosulfan to the Prior Informed Consent
      (PIC) procedure -- importing Parties must give explicit consent
      before an exporting Party may ship it; this is an international
      trade-control instrument, not a domestic use ban.
    decision_date: "2011-06-24"
    effective_date: "2011-10-24"
    citation:
      source_document: "Rotterdam Convention, Conference of the Parties decisions RC-5/3, RC-5/4 and RC-5/5 of 24 June 2011 (fifth meeting, Geneva, 20-24 June 2011), adding alachlor, aldicarb and endosulfan to Annex III; cited via the Secretariat's 'Rotterdam Convention texts and annexes (revised in 2017)', footnote to the Annex III chemicals table and the Convention's history section. The decision documents themselves (UNEP/FAO/RC/COP.5 series) were NOT retrieved, so their document numbers are not given here."
      source_clause: "Secretariat text: 'The fifth meeting of the Conference of the Parties (COP-5) was held from 20 to 24 June 2011 resulting in the addition of the following chemicals in Annex III alachlor, aldicarb and endosulfan in the pesticide category (decisions RC-5/3, RC-5/4 and RC-5/5). These amendments to Annex III entered into force on 24 October 2011.' Footnote: 'RC-5/3, RC-5/4 and RC-5/5 of 24 June 2011'. The fourth meeting (COP-4, 27-31 October 2008) is described there as adding tributyltin compounds only (RC-4/5); the earlier citation here (UNEP/FAO/RC/COP.4/9) was the Secretariat's DRAFT proposal, with a bracketed entry-into-force date, that COP-4 did not adopt, and did not support a listing. CORRECTED 2026-09-20; the dates below were already 2011 and are unchanged."
      retrieved_at: "2026-09-20"
      url: "http://www.pic.int/Portals/5/ConventionText/UNEP-FAO-RC-CONVTEXT-2017.English.pdf"
    hs6_candidates:
      - hs6: "380810"
        confidence: 0.5
        reasoning: "Formulated organochlorine insecticide/acaricide; only matching HS6 heading."
        imprecision: "380810 aggregates all formulated insecticides globally; see mappings v1. Additionally, PIC listing constrains export procedure (consent requirement) rather than banning trade outright, so the expected trade-flow signature differs from an EU non-renewal and should not be assumed to produce the same sign/magnitude of effect."
        confirmed: true
    notes: >
      Four-month decision-to-effective gap (24 Jun to 24 Oct 2011) is
      structurally different from the EU cases: it is the treaty
      amendment's own entry-into-force delay, not a national
      implementation grace period. Because this is a PIC consent
      requirement rather than a ban, "displacement" here would show up as
      reduced ease of export to non-consenting destinations rather than a
      destination shift toward non-restricting jurisdictions in the same
      way an EU non-renewal would -- the competing-explanations step
      (Step 4) should treat this event's expected signature as distinct
      from the EU non-renewal events above.

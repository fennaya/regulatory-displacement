# Restriction register, version 1. Every event below was verified against
# a primary source (EUR-Lex regulation/decision text, a Rotterdam
# Convention decision, or a court judgment) fetched on 2026-09-18. Records
# without a verifiable citation were not added -- this is a small, real
# register (9 events, 8 substances), not an exhaustive one, per this
# project's "narrow scope, work end to end" instruction. hs6_candidates
# below reference data/register/mappings/chemical_hs6_mappings_v1.yaml.

events:
  - event_id: "eu-2018-imidacloprid"
    substance: "Imidacloprid"
    jurisdiction: "EU"
    restriction_type: "severe_restriction"
    scope: >
      All outdoor uses banned EU-wide; use restricted to permanent
      greenhouses only (crop and any treated seed must remain in a
      permanent greenhouse through the crop's entire life cycle).
    decision_date: "2018-05-29"
    effective_date: "2018-12-19"
    citation:
      source_document: "Commission Implementing Regulation (EU) 2018/783 of 29 May 2018 amending Implementing Regulation (EU) No 540/2011 as regards the conditions of approval of the active substance imidacloprid"
      source_clause: "Article 3: Member States shall amend or withdraw existing authorisations for plant protection products containing imidacloprid by 19 September 2018 at the latest; Annex restriction: 'Only uses as insecticide in permanent greenhouses...may be authorised.'"
      retrieved_at: "2026-09-18"
      url: "https://eur-lex.europa.eu/legal-content/EN/TXT/HTML/?uri=CELEX%3A32018R0783"
    hs6_candidates:
      - hs6: "380810"
        confidence: 0.55
        reasoning: "Formulated insecticide; only matching HS6 heading."
        imprecision: "380810 aggregates all formulated insecticides globally; see mappings v1 for full discussion."
        confirmed: true
    notes: >
      19 September 2018 is the deadline for Member States to amend
      national authorisations; 19 December 2018 is the deadline by which
      farmers had to stop use under the amended authorisations. We record
      effective_date as the farmer-facing compliance deadline (the
      substantive end of legal use) and the earlier authorisation-amendment
      deadline here as context. This 5-month gap between decision (29 May)
      and the final compliance deadline (19 Dec) -- over 6 months -- is
      itself a stockpiling/dumping window worth testing for.


  - event_id: "eu-2007-paraquat"
    substance: "Paraquat"
    jurisdiction: "EU"
    restriction_type: "withdrawal"
    scope: >
      EU-wide inclusion of paraquat as an approved active substance was
      judicially annulled; the European Commission's Standing Committee on
      the Food Chain and Animal Health instructed Member States to remove
      paraquat from the market and revoke authorisations, with a grace
      period for existing stocks under Article 4(6) of Directive 91/414/EEC.
    decision_date: "2007-07-11"
    effective_date: "2007-07-13"
    citation:
      source_document: "Judgment of the Court of First Instance (Second Chamber, Extended Composition), Case T-229/04, Kingdom of Sweden v Commission of the European Communities, 11 July 2007, annulling Commission Directive 2003/112/EC of 1 December 2003"
      source_clause: "Operative part: annuls Commission Directive 2003/112/EC of 1 December 2003 amending Council Directive 91/414/EEC to include paraquat as an active substance, on the grounds that the assessment procedure failed to satisfy the requirements for the protection of human and animal health."
      retrieved_at: "2026-09-18"
      url: "https://eur-lex.europa.eu/legal-content/EN/TXT/?uri=celex:62004TJ0229"
    hs6_candidates:
      - hs6: "380830"
        confidence: 0.55
        reasoning: "Formulated contact herbicide; only matching HS6 heading."
        imprecision: "380830 aggregates all formulated herbicides globally, including atrazine, also tracked in this register under the same HS6 code."
        confirmed: true
    notes: >
      NO single Commission-wide withdrawal deadline was set: per the
      Commission's Standing Committee instruction (12-13 July 2007,
      reported via PAN Europe's archived timeline,
      https://www.pan-europe.info/old/Archive/Paraquat/timeline.html),
      individual Member States set their own withdrawal deadlines, ranging
      from immediate to December 2007 or mid-2008. This jurisdiction-level
      heterogeneity in the effective date is itself recorded here rather
      than papered over with a single assumed date; effective_date above
      (13 July 2007) is the date of the Commission's instruction to
      Member States to begin withdrawal, not a harmonised EU-wide deadline.
      This is a genuinely unusual case (judicial annulment, not an
      administrative non-renewal) and the least clean-cut event in this
      register.

